# One entry per project: a client job, a game, a campaign, a case study, a body of personal work.
# Claude curates this (see library/README.md), then runs `uv run library/tools/build.py`.
#
# tiers: the groups the Projects tab shows, most important first. Rename them to suit your field.
tiers:
  - {key: headline, label: Headline work}
  - {key: notable, label: Notable}
  - {key: other, label: Other work}
  - {key: personal, label: Personal projects}
  - {key: not-credit, label: "Tests, pitches and reference (not credits)"}

